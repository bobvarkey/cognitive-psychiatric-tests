name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# .env is no longer tracked. Tests and the CI build only need placeholder
# values so the Supabase client can be constructed; nothing here is deployed.
env:
  VITE_SUPABASE_URL: https://placeholder.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
  VITE_SUPABASE_PROJECT_ID: placeholder

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint (non-blocking; existing error baseline)
        run: npm run lint
        continue-on-error: true

      - name: Run Tests
        run: npm test

      - name: Production Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical
