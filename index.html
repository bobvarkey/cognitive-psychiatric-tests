<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script src="https://appbuild.diy/snippets/appbuild-wrapper-sdk.js" defer></script>

    <!-- Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Primary metadata -->
    <title>Cognito — Clinical Assessment Toolkit</title>
    <meta name="description" content="54 evidence-based neuropsychiatric assessments for clinicians. MoCA, PANSS, HAM-D, BPRS, UPDRS and more — scored instantly, HIPAA-safe, offline-ready." />
    <meta name="keywords" content="clinical assessment, psychiatry, neurology, MoCA, PANSS, HAM-D, BPRS, MDS-UPDRS, cognitive screening, psychiatric evaluation" />
    <meta name="author" content="Cognito" />
    <meta name="application-name" content="Cognito" />

    <!-- App-store / PWA hints -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cognito" />
    <meta name="theme-color" content="#000000" />

    <!-- Open Graph -->
    <meta property="og:title" content="Cognito — Clinical Assessment Toolkit" />
    <meta property="og:description" content="54 evidence-based neuropsychiatric assessments. Scored instantly. Built for clinicians." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://psycognito.com" />
    <meta property="og:image" content="https://psycognito.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Cognito" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cognito — Clinical Assessment Toolkit" />
    <meta name="twitter:description" content="54 evidence-based neuropsychiatric assessments. Scored instantly. Built for clinicians." />
    <meta name="twitter:image" content="https://psycognito.com/og-image.png" />

    <!-- Structured data hint for search -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Cognito",
      "description": "Clinical assessment toolkit with 54 neuropsychiatric scales",
      "applicationCategory": "MedicalApplication",
      "operatingSystem": "Web, iOS, Android"
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
